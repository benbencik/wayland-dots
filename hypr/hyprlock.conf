# ~/.config/hypr/hyprlock.conf

$font = IosevkaTerm Nerd Font

general {
  hide_cursor = true
  grace = 0
  ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 1
}

# INPUT FIELD
input-field {
  monitor = 
  size = 400, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba(231, 138, 78, 1.0)
  inner_color = rgba(40, 40, 40, 1.0)
  font_color = rgba(212, 190, 152, 1.0)
  fade_on_empty = false
  placeholder_text = Logged in as $USER
  hide_input = false
  check_color = rgba(169, 182, 101, 1.0)]
  fail_color = rgba(234, 105, 98, 1.0)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgba(216, 166, 87, 1.0)
  position = 0, -47
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = $TIME
  color = rgba(212, 190, 152, 1.0)
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] LC_TIME=en_US.UTF-8 date +"%A, %d %B %Y"
  color = rgba(212, 190, 152, 1.0)
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = rgba(212, 190, 152, 1.0)
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}